name: Publicar release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compilar
        run: mvn -B package
      - name: Preparar archivos
        run: |
          mkdir dist
          cp target/TukiBot.jar dist/TukiBot.jar
          cp iniciar.bat iniciar.sh dist/
          (cd dist && zip -q TukiBot-${GITHUB_REF_NAME}.zip TukiBot.jar iniciar.bat iniciar.sh)
      - name: Crear release
        uses: softprops/action-gh-release@v2
        with:
          name: TukiBot ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: |
            dist/TukiBot.jar
            dist/TukiBot-${{ github.ref_name }}.zip
