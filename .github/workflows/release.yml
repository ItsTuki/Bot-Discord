name: Publicar release

# Se publica al subir un tag v* o un commit a main cuyo mensaje contenga [release].
# La versión sale del pom.xml.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Leer versión
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(mvn -q -B help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"
          fi
      - name: Compilar
        run: mvn -B package
      - name: Preparar archivos
        run: |
          mkdir dist
          cp target/TukiBot.jar dist/TukiBot.jar
          cp iniciar.bat iniciar.sh dist/
          (cd dist && zip -q TukiBot-${{ steps.version.outputs.tag }}.zip TukiBot.jar iniciar.bat iniciar.sh)
      - name: Crear release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: TukiBot ${{ steps.version.outputs.tag }}
          body_path: .github/release-notes.md
          files: |
            dist/TukiBot.jar
            dist/TukiBot-${{ steps.version.outputs.tag }}.zip
