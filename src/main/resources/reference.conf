/// START OF TUKIBOT CONFIG ///
/////////////////////////////////////////////////////////////
// Configuración de TukiBot                                //
/////////////////////////////////////////////////////////////
// Las líneas que empiezan con // se ignoran               //
// Solo el token es obligatorio; el resto tiene valores    //
// por defecto si no lo cambias.                           //
/////////////////////////////////////////////////////////////


// Token del bot (Developer Portal > tu aplicación > Bot > Reset Token).
// NUNCA lo subas a GitHub ni lo compartas.

token = BOT_TOKEN_HERE


// ID de usuario del dueño del bot (número de 17-19 dígitos).
// Si lo dejas en 0, el bot usa automáticamente al dueño de la aplicación
// en el Developer Portal.

owner = 0 // OWNER ID


// Actividad que muestra el bot. Usa NONE para no mostrar nada o DEFAULT
// para "Escuchando /play".
// Formatos: "Escuchando X", "Jugando X", "Viendo X", "Compitiendo en X",
// "Transmitiendo <usuario_twitch> X" (también sirven en inglés:
// "Listening to X", "Playing X"...). Cualquier otro texto se usa como
// estado personalizado.

game = "DEFAULT"


// Estado del bot: ONLINE, IDLE, DND o INVISIBLE

status = ONLINE


// Muestra la canción actual en la actividad del bot.
// Solo funciona si el bot está reproduciendo en UN solo servidor.

songinstatus = false


// Pone la canción actual como "estado" del canal de voz (la línea de texto
// que Discord muestra bajo el nombre del canal). Necesita el permiso
// "Establecer estado del canal de voz".

vcstatus = true


// Publica automáticamente el panel de "Reproduciendo ahora" (con botones)
// en el canal donde se pidió la música cada vez que empieza una canción.

npauto = true


// Sugerencias de YouTube mientras escribes en /play y /playnext.

autocomplete = true


// Respuestas de texto del bot original de ItsTuki (sin barra):
// "ItsTuki", "$bye", "!gen" y "!moneda".
// Necesita el intent "MESSAGE CONTENT" activado en el Developer Portal;
// si no lo tienes activado, pon esto en false o el bot no podrá conectarse.

textresponses = true


// Canal de Twitch que comparte /twitch (solo el nombre de usuario).

twitch = "theitstuki"


// ID de un servidor de pruebas. Si lo pones, los comandos se registran
// solo ahí (aparecen al instante, ideal para desarrollar). Con 0 se
// registran de forma global en todos los servidores.

devguild = 0


// Emojis que usa el bot en sus respuestas.

success = "🎶"
warning = "💡"
error = "🚫"
loading = "⌚"
searching = "🔎"


// Color de acento de los paneles (formato hexadecimal). Con "DEFAULT" se
// usa el color del rol del bot.

color = "#5865F2"


// Muestra la miniatura de la canción en el panel de "Reproduciendo ahora".

npimages = true


// Si es true, el bot se queda en el canal de voz al terminar la cola.

stayinchannel = false


// Duración máxima en segundos de las canciones que se pueden agregar.
// 0 o negativo = sin límite.

maxtime = 0


// Páginas máximas que se cargan de una playlist de YouTube (cada página
// tiene hasta 100 canciones).

maxytplaylistpages = 10


// Proporción de oyentes que debe votar para saltar una canción
// (0.55 = 55%). Cada servidor puede cambiarla con /config skipratio.

skipratio = 0.55


// Segundos que el bot espera solo en un canal de voz antes de salir.
// 0 o negativo = nunca sale solo.

alonetimeuntilstop = 300


// Carpeta donde se guardan las playlists (archivos .txt con un enlace o
// búsqueda por línea).

playlistsfolder = "Playlists"


// Opciones de YouTube.
//
// ytdlp: reproduce YouTube con yt-dlp (recomendado). Si no lo tienes
// instalado, el bot descarga yt-dlp y Deno en la carpeta "bin" la primera
// vez y mantiene yt-dlp actualizado. Pon false para usar solo el método
// interno. ytdlppath: ruta a tu propio yt-dlp (opcional).
// Si YouTube responde "Sign in to confirm you're not a bot" con algún video:
// cookiesfrombrowser: navegador del que yt-dlp toma la sesión de YouTube
//   (firefox, chrome, edge, brave...). Firefox es el que mejor funciona en
//   Windows; Chrome y Edge deben estar cerrados para poder leerlas.
// cookies: o bien la ruta a un archivo cookies.txt exportado. Si dejas un
//   archivo llamado cookies.txt junto a TukiBot.jar, se usa solo.
// Usa una cuenta de Google secundaria en ese navegador si puedes.
//
// remotecipher: servidor que descifra las firmas de los videos de YouTube.
// YouTube cambia su reproductor seguido y el descifrado local se rompe, así
// que por defecto (vacío) se usa el servidor público yt-cipher
// (https://cipher.kikkia.dev/). Puedes poner la URL de uno propio
// (https://github.com/kikkia/yt-cipher) o "none" para descifrar localmente.
//
// oauth: si YouTube empieza a pedir "inicia sesión para confirmar que no
// eres un bot", activa oauth = true, reinicia y sigue las instrucciones de
// la consola (te dará un código para google.com/device). El bot guarda solo
// el refresh token. Usa una cuenta de Google secundaria, nunca la principal.

youtube {
  ytdlp = true
  ytdlppath = ""
  cookies = ""
  cookiesfrombrowser = ""
  oauth = false
  refreshtoken = ""
  remotecipher = ""
  remotecipherpassword = ""
}


// Nivel de detalle del registro: off, error, warn, info, debug, trace, all

loglevel = info


// Transformaciones avanzadas de búsquedas (heredado de JMusicBot).
// Déjalo vacío si no sabes qué es.

transforms = {}

/// END OF TUKIBOT CONFIG ///
